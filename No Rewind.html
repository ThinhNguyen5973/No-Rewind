<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NO REWIND</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
  #gate {
    position: fixed; inset: 0; z-index: 10; cursor: pointer;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: .6rem; text-align: center;
    color: #ddd; background: #000; user-select: none;
    font: 14px/1.6 ui-monospace, Menlo, monospace;
    transition: opacity 3s ease;
  }
  #gate .t  { font-size: 1.4rem; letter-spacing: .35em; }
  #gate .s  { color: #666; font-size: .8rem; }
  #gate.gone { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="gate">
  <div class="t">NO REWIND</div>
  <div>time begins with a single gesture</div>
  <div class="s">after this, there are no controls</div>
</div>
<canvas id="wave"></canvas>

<script>
'use strict';

/* ================= configuration ================= */
const TITLE          = 'NO REWIND';
const PX_PER_SECOND  = 60;    // scroll speed of the wave (a 1920px screen shows ~32 min)
const AMP            = 1.15;  // vertical exaggeration
const HUE_PERIOD     = 3600;  // seconds for the wave's colour to cycle once (1 hour)

/* ===== this performance will never happen again ===== */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const SEED    = (Date.now() ^ (Math.random() * 0xffffffff)) >>> 0;
const rnd     = mulberry32(SEED);
const rrange  = (a, b) => a + rnd() * (b - a);
const rchoice = (arr) => arr[Math.floor(rnd() * arr.length)];

/* ===== canvases: the screen, and the strip of history ===== */
const canvas = document.getElementById('wave');
const sctx   = canvas.getContext('2d');
const buf    = document.createElement('canvas'); // history lives here
const bctx   = buf.getContext('2d');
let W = 0, H = 0, CY = 0;

function sizeCanvases() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = buf.height = window.innerHeight;
  buf.width = W;
  CY = H / 2;
  bctx.fillStyle = '#000';
  bctx.fillRect(0, 0, W, H);  // note: resizing wipes history — time has a new frame
}
window.addEventListener('resize', sizeCanvases);
sizeCanvases();

/* ================= the audio universe ================= */
const SCALE = [1, 9/8, 5/4, 3/2, 5/3, 2];   // just intervals over a random root
let actx = null, analyser = null, master = null, echoIn = null, ROOT = 55;

function start() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  actx.resume();                              // the one gesture browsers require

  master = actx.createGain();
  master.gain.value = 0;
  const comp = actx.createDynamicsCompressor();
  comp.threshold.value = -24; comp.knee.value = 20;
  comp.ratio.value = 4; comp.attack.value = 0.01; comp.release.value = 0.2;
  analyser = actx.createAnalyser();
  analyser.fftSize = 2048;
  master.connect(comp).connect(analyser).connect(actx.destination);

  buildDrone();
  buildNoise();
  buildEcho();
  runBells();
  runChords();

  master.gain.setTargetAtTime(0.75, actx.currentTime, 4); // slow dawn
  document.getElementById('gate').classList.add('gone');
  document.body.style.cursor = 'none';       // nothing left to interact with
  lastDraw = performance.now();
  requestAnimationFrame(loop);
}

/* a breathing drone: the piece's continuous ground of time */
function buildDrone() {
  ROOT = rchoice([49, 55, 58.27, 65.41]);    // G1 / A1 / Bb1 / C2
  const g = actx.createGain(); g.gain.value = 0;
  const filter = actx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = ROOT * 6; filter.Q.value = 0.7;
  filter.connect(g).connect(master);

  const harmonics = 3 + Math.floor(rnd() * 3);
  for (let i = 1; i <= harmonics; i++) {
    const osc = actx.createOscillator();
    osc.type = rchoice(['sine', 'sine', 'triangle']);
    osc.frequency.value = ROOT * i * rrange(0.997, 1.003); // softly detuned
    const og = actx.createGain();
    og.gain.value = rrange(0.05, 0.12) / i;
    osc.connect(og).connect(filter);
    osc.start();
    if (i === 1) {                            // the fundamental slowly breathes
      const lfo = actx.createOscillator();
      lfo.frequency.value = rrange(0.02, 0.08);     // one cycle every 12–50 s
      const amt = actx.createGain();
      amt.gain.value = rrange(4, 12);               // cents
      lfo.connect(amt).connect(osc.detune);
      lfo.start();
    }
  }
  g.gain.setTargetAtTime(0.22, actx.currentTime + 3, 8);
}

/* a faint ocean of filtered brown noise: the air of the room */
function buildNoise() {
  const len = actx.sampleRate * 4;
  const data = new Float32Array(len);
  let last = 0;
  for (let i = 0; i < len; i++) {
    last = (last + 0.02 * (rnd() * 2 - 1)) / 1.02;
    data[i] = last * 3.5;
  }
  const src = actx.createBufferSource();
  src.buffer = actx.createBuffer(1, len, actx.sampleRate);
  src.buffer.copyToChannel(data, 0);
  src.loop = true;
  const filter = actx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = rrange(200, 400);
  const g = actx.createGain(); g.gain.value = 0;
  src.connect(filter).connect(g).connect(master);
  src.start();
  g.gain.setTargetAtTime(rrange(0.015, 0.03), actx.currentTime + 2, 10);
}

/* a decaying echo: events linger in the past before they die out */
function buildEcho() {
  echoIn = actx.createGain();
  const delay = actx.createDelay(2);
  delay.delayTime.value = rrange(0.25, 0.55);
  const fb = actx.createGain(); fb.gain.value = rrange(0.35, 0.55);
  const tone = actx.createBiquadFilter();
  tone.type = 'lowpass'; tone.frequency.value = 1800;
  const wet = actx.createGain(); wet.gain.value = 0.5;
  echoIn.connect(delay).connect(tone).connect(wet).connect(master);
  delay.connect(fb).connect(delay);
}

/* bells: unrepeatable events, dropped at random into the stream */
function playBell(t) {
  const freq = ROOT * rchoice(SCALE) * rchoice([2, 4, 8]);
  const osc = actx.createOscillator();
  osc.type = rchoice(['sine', 'sine', 'triangle']);
  osc.frequency.value = freq;
  const g = actx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(rrange(0.08, 0.2), t + 0.02);
  const dur = rrange(2, 7);
  g.gain.setTargetAtTime(0.0001, t + 0.03, dur / 4);
  const pan = actx.createStereoPanner();
  pan.pan.value = rrange(-0.8, 0.8);
  osc.connect(g).connect(pan);
  const dry = actx.createGain(); dry.gain.value = 0.6;
  pan.connect(dry).connect(master);
  pan.connect(echoIn);
  osc.start(t); osc.stop(t + dur * 2 + 1);
}
function runBells() {
  let next = actx.currentTime + rrange(3, 8);
  setInterval(() => {
    while (next < actx.currentTime + 2) {     // always scheduled ahead of "now"
      playBell(next);
      next += rrange(2.5, 9);
    }
  }, 500);
}

/* chords: the harmonic weather changes every minute or so */
function playChord(t) {
  const dur = rrange(40, 80);
  const notes = [];
  while (notes.length < 3) {
    const n = rchoice(SCALE) * rchoice([1, 2, 2, 4]);
    if (!notes.includes(n)) notes.push(n);
  }
  for (const n of notes) {
    const osc = actx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = ROOT * n * rrange(0.998, 1.002);
    const g = actx.createGain();
    const peak = rrange(0.04, 0.075);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + dur * 0.25);   // slow bloom
    g.gain.setValueAtTime(peak, t + dur * 0.6);
    g.gain.linearRampToValueAtTime(0, t + dur);             // slow dissolve
    const pan = actx.createStereoPanner();
    pan.pan.value = rrange(-0.7, 0.7);
    osc.connect(g).connect(pan).connect(master);
    osc.start(t); osc.stop(t + dur + 0.1);
  }
}
function runChords() {
  let next = actx.currentTime + rrange(15, 30);
  setInterval(() => {
    while (next < actx.currentTime + 3) {
      playChord(next);
      next += rrange(45, 90);
    }
  }, 1000);
}

/* ================= the visual: history scrolls, never returns ================= */
const data = new Float32Array(2048);
let lastDraw = 0;

function maybeDraw() {
  const now = performance.now();
  const dt = (now - lastDraw) / 1000;
  if (dt < 0.05) return;
  lastDraw = now;
  render(Math.min(dt, 3600));
}
function loop() { maybeDraw(); requestAnimationFrame(loop); }
setInterval(maybeDraw, 1000);   // keeps recording history even when the tab is hidden

function render(dt) {
  const elapsed = actx.currentTime;           // the piece's own clock
  let dx = PX_PER_SECOND * dt;

  if (dx >= W) {                              // a very long absence: start a fresh frame
    bctx.fillStyle = '#000';
    bctx.fillRect(0, 0, W, H);
    dx = W;
  } else {                                    // shift history left: the past recedes
    bctx.drawImage(buf, -dx, 0);
    bctx.fillStyle = '#000';
    bctx.fillRect(W - dx, 0, dx, H);
  }
  const x0 = W - dx;                          // the newly born slice of "now"

  analyser.getFloatTimeDomainData(data);
  let mn = 0, mx = 0;
  for (let i = 0; i < data.length; i++) {
    if (data[i] < mn) mn = data[i];
    if (data[i] > mx) mx = data[i];
  }
  const hue = (elapsed * 360 / HUE_PERIOD) % 360;   // colour = depth of time

  // envelope band: the mass of the moment
  bctx.fillStyle = `hsla(${hue}, 80%, 60%, 0.25)`;
  bctx.fillRect(x0, CY - mx * CY * AMP, dx, Math.max(1, (mx - mn) * CY * AMP));

  // oscillation line: the living detail
  bctx.strokeStyle = `hsl(${hue}, 85%, 68%)`;
  bctx.lineWidth = 1.2;
  bctx.beginPath();
  const step = Math.max(1, Math.floor(data.length / (dx * 8)));
  for (let i = 0; i < data.length; i += step) {
    const x = x0 + (i / data.length) * dx;
    const y = CY - data[i] * CY * AMP;
    i === 0 ? bctx.moveTo(x, y) : bctx.lineTo(x, y);
  }
  bctx.stroke();

  /* ---- present the history plus annotations that never scroll ---- */
  sctx.drawImage(buf, 0, 0);
  sctx.fillStyle = 'rgba(255,255,255,0.12)';
  sctx.fillRect(0, CY, W, 1);                 // the horizon: absolute silence
  sctx.fillStyle = '#fff';
  sctx.fillRect(W - 2, 0, 2, H);             // the now-line: where time actually is

  sctx.font = '12px ui-monospace, Menlo, monospace';
  sctx.fillStyle = 'rgba(255,255,255,0.85)';
  sctx.textAlign = 'right';
  sctx.fillText(fmtTime(elapsed), W - 10, 22);
  sctx.textAlign = 'left';
  sctx.fillStyle = 'rgba(255,255,255,0.5)';
  sctx.fillText(TITLE, 10, 22);
  sctx.fillText('session ' + SEED.toString(16).padStart(8, '0') +
                ' — this performance will never happen again', 10, H - 12);
}

function fmtTime(s) {
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = Math.floor(s) % 60;
  return 'T+' + String(h).padStart(2, '0') + ':' +
                String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0');
}

/* ================= time begins ================= */
document.getElementById('gate').addEventListener('pointerdown', start);

/* Optional: warn that leaving destroys this performance forever.
   (Browsers replace the text with their own generic message.)
window.addEventListener('beforeunload', (e) => { e.preventDefault(); e.returnValue = ''; });
*/
</script>
</body>
</html>
